<html>
<head>
	<title>Client</title>
	<link rel="icon" type="image/png" href="/favicon.png"> 
	<link rel="shortcut icon" href="/favicon.ico">
</head>
<body>
	<h1>Client di prova per verificare la comunicazione con il web server php tramite il gestore di messaggi</h1>
	
	<p><a href="javascript:StartInvioMessaggi()">Inizia invio dei messaggi al gestore messaggi.</a></p>
	<!-- 
	<p><a href="">Registrazione postazione sulla piattaforma</a></p>
	<p><a href="">De-Registrazione postazione sulla piattaforma</a></p>

	<h2>Test javascript</h2>
	-->
	<p>Test get Yaws: <span id="get"></span></p>
	<p>Test get PHP: <span id="get_php"></span></p>
	
	<div>Test POST con parametri Yaws: <span id="post_parametri"></span></div>
	<div style="border: 1px solid black;" id="return_message"></div>
	<div>Test POST con parametri PHP: <span id="post_parametri_php"></span></div>
	<div style="border: 1px solid black;" id="return_message_php"></div>
	
	<script src="utils.js">	</script>
	<script>		
	var server = "http://localhost:8080/server.yaws";
	var server_php = "http://localhost/server.php";

	var t_invio_messaggi;
	var invio_messaggi_refresh_time_first_time = 1 * 1000; /* x secondi */
	var invio_messaggi_refresh_time = 5 * 1000; /* x secondi */
	var check_messaggi_refresh_time = 2 * 1000; /* x secondi */
	var numero_iterazioni = 0;
	var id_message = -1;
	var dati;
	
	var msg_type = "test_message_m";

	/* function StartInvioMessaggi(webpage, session_id) { */
	function StartInvioMessaggi() {
		clearTimeout(t_invio_messaggi);
		/*
		keepalive_webpage = webpage;
		keepalive_session_id = session_id;
		*/

		t_invio_messaggi = setTimeout('InvioMessaggio()', invio_messaggi_refresh_time_first_time); 
	}

	/* termina l'invio dei messaggi */
	function StopInvioMessaggi() {
		clearTimeout(t_invio_messaggi);
	}

	/* Invio i messaggi */
	function InvioMessaggio()
	{
		switch (msg_type) {
			case "test_message_m":
				dati = 
				{ 
					"msg_type": "test_message_m", 
					"msg_content": {
						"numero_iterazioni": numero_iterazioni, 
						"test": "Sara" 
					}
				};
				break;
			case "test_message_r":
				dati = 
				{ 
					"msg_type": "test_message_r", 
					"msg_content": {
						"id": id_message 
					}
				};
				break;
			default:
				dati = 
				{ 
					"msg_type": "test_message", 
					"msg_content": {
						"numero_iterazioni": numero_iterazioni, 
						"test": "Sara" 
					}
				};
			
		}
		console.log("Dati inviati:" + JSON.stringify(dati));
		post(server, dati).then((post_res) => {
			document.getElementById("post_parametri").innerHTML = post_res.risposta.result_type;
			document.getElementById("return_message").innerHTML = post_res.risposta.result_content.result_desc + " - " + post_res.risposta.result_content.id_message;
			id_message = post_res.risposta.result_content.id_message;
			console.log("msg-arrived:" + post_res.risposta.result_type);
			console.log("post_res :" + JSON.stringify(post_res.risposta.result_content));
			if (post_res.risposta.result_type == "test_result_m") {
				/* passo a controllare se il risultato della richiesta al server è arrivato */
				msg_type = "test_message_r";
			}
			console.log("prossimo comando :" + msg_type);
		});
/*
		const dati_php = 
		{ 
			"msg_type": "test_message", 
			"msg_content": {
				"numero_iterazioni": numero_iterazioni, 
				"test": "Sara" 
			}
		};
		post(server_php, dati_php).then((post_res) => {
			document.getElementById("post_parametri_php").innerHTML = post_res.risposta.result_type;
			document.getElementById("return_message_php").innerHTML = post_res.risposta.result_content;
			console.log("msg-arrived_php:" + post_res.risposta.result_type);
			console.log("post_res_php:" + post_res.risposta.result_content);
		});
*/

		numero_iterazioni = numero_iterazioni + 1;

	  /* faccio ripartire il timer per la prossima iterazione */
  	  t_invio_messaggi = setTimeout('InvioMessaggio()', invio_messaggi_refresh_time); 
	}

	

		
		get(server).then((post) => {
			document.getElementById("get").innerHTML = post.result;
		});

		get(server_php).then((post) => {
			document.getElementById("get_php").innerHTML = post.result;
		});

	</script>
</body>
</html>
